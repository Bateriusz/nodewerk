name: NW-01 Baseline & Deployment Risk Verification

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]

jobs:
  schema-and-contract-checks:
    name: Schema, Dependency Closure & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest pyyaml

      - name: Run NW-01 automated contract and schema test suite
        run: pytest -v

  windows-reproducibility-and-fixtures:
    name: Windows 11 x64 Build, Reproducibility & Verify (Full)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run NW-01 Full verification script
        shell: pwsh
        run: ./tools/verify-nw01.ps1 -Mode Full
