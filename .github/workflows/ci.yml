name: NW-01 Baseline & Deployment Risk Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-contract-checks:
    name: Schema, Dependency Closure & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run NW-01 automated contract and schema test suite
        run: pytest -v

      - name: Run NW-03 package/oracle/lowering contract checks
        run: python tools/verify_nw03.py --mode ContractsOnly --summary-json "$RUNNER_TEMP/nw03-contracts.json"

      - name: Run NW-04 package-player contract checks
        run: python tools/verify_nw04.py --mode ContractsOnly --summary-json "$RUNNER_TEMP/nw04-contracts.json"

      - name: Run NW-01 ContractsOnly verification
        run: python tools/verify_nw01.py --mode ContractsOnly

  windows-reproducibility-and-fixtures:
    name: Windows 11 x64 Build, Reproducibility & Concrete Check Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Parse CleanSystem runner with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\nw01\run-clean-system.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Bootstrap exact NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath "$env:RUNNER_TEMP\nw01-bootstrap-provenance.json"

      - name: Verify bootstrap idempotence on an already-correct host
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath "$env:RUNNER_TEMP\nw01-bootstrap-idempotence.json"

      - name: Export exact MSVC/SDK build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv

      - name: Verify exact pinned toolchain
        shell: pwsh
        run: pwsh ./tools/nw01/doctor.ps1

      - name: Run NW-01 contract test suite on Windows
        run: pytest -v

      - name: Run NW-04 package-player contract checks on Windows
        run: python tools/verify_nw04.py --mode ContractsOnly --summary-json "$env:RUNNER_TEMP\nw04-contracts.json"

      - name: Run NW-01 Windows harness behaviour tests (required)
        env:
          NW_HARNESS_BEHAVIOR_TESTS: "1"
        shell: pwsh
        run: python -m pytest -v tests/test_nw01_windows_harness.py

      - name: Verify NW-01 concrete build, reproducibility, dependency, and failure-recovery checks
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/run-build-checks.ps1
          -SummaryPath "$env:RUNNER_TEMP\nw01-build-checks.json"

      - name: Upload NW-01 build-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw01-windows-build-checks
          path: |
            ${{ runner.temp }}/nw01-bootstrap-provenance.json
            ${{ runner.temp }}/nw01-bootstrap-idempotence.json
            ${{ runner.temp }}/nw01-build-checks.json
            benchmarks/reproducibility/*.json
            benchmarks/ledgers/*.json
            benchmarks/toolchain-manifest.v1.json
          if-no-files-found: warn

  windows-physical-evidence:
    name: Physical Windows 11 x64 GPU Evidence & CleanSystem Package
    if: vars.NW_PHYSICAL_RUNNER_LABEL != ''
    runs-on: ${{ vars.NW_PHYSICAL_RUNNER_LABEL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Enter pinned physical-host build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv

      - name: Verify pinned physical-host toolchain
        shell: pwsh
        run: pwsh ./tools/nw01/doctor.ps1

      - name: Run NW-01 Full physical-evidence validation
        id: full
        continue-on-error: true
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/run-full.ps1
          -SummaryPath "$env:RUNNER_TEMP\nw01-full-mode.json"
          -ExportGitHubEnv

      - name: Capture NW-04 player evidence when artifacts are available
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $fixture = Get-ChildItem -Path . -Recurse -Filter nw_package_player_fixture.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          $package = Get-ChildItem -Path . -Recurse -Filter '*.nwp' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notlike '*fixtures\nw04*' } |
            Select-Object -First 1
          if ($null -eq $fixture -or $null -eq $package) {
            Write-Host "[NW04-EVIDENCE] player/package artifacts unavailable; Ada/Blackwell evidence remains pending_unverified."
            exit 0
          }
          pwsh ./tools/nw01/capture-nw04-player.ps1 -Fixture $fixture.FullName -Package $package.FullName -Tier auto

      - name: Package verified CleanSystem deployment
        if: always() && env.NW_FULL_SUMMARY != ''
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/prepare-clean-system.ps1
          -FullSummary "$env:NW_FULL_SUMMARY"
          -OutputRoot "$env:RUNNER_TEMP\nw01-clean-system-package"
          -ZipPath "$env:RUNNER_TEMP\nw01-clean-system-package.zip"

      - name: Render NW-01 evidence status
        if: always() && env.NW_FULL_SUMMARY != ''
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/evidence-summary.ps1
          -FullSummary "$env:NW_FULL_SUMMARY"
          -JsonPath "$env:RUNNER_TEMP\nw01-evidence-summary.json"
      - name: Upload NW-01 clean-system deployment
        uses: actions/upload-artifact@v4
        with:
          name: nw01-clean-system-deploy-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nw01-clean-system-package/
            ${{ runner.temp }}/nw01-clean-system-package.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload NW-01 physical evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw01-windows-physical-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nw01-full-mode.json
            ${{ runner.temp }}/nw01-evidence-summary.json
            benchmarks/reproducibility/*.json
            benchmarks/ledgers/*.json
            benchmarks/toolchain-manifest.v1.json
            benchmarks/hardware/*.json
            benchmarks/nw04-hardware-evidence.json
            benchmarks/clean-system/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce verified Full baseline
        if: always()
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP "nw01-full-mode.json"
          if (-not (Test-Path $summaryPath -PathType Leaf)) {
            Write-Error "Physical Full summary is missing."
            exit 1
          }
          $summary = Get-Content -Raw $summaryPath | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$summary.wrapper_invocation_id)) {
            Write-Error "Physical Full summary was not produced by run-full.ps1 in this invocation."
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace([string]$summary.source_commit) -or
              -not [string]::Equals([string]$summary.source_commit, [string]$env:GITHUB_SHA, [System.StringComparison]::OrdinalIgnoreCase)) {
            Write-Error "Physical Full summary source_commit does not match the checked-out revision."
            exit 1
          }
          if ($summary.full_baseline_passed -ne $true) {
            Write-Error "Physical Full baseline remains incomplete or failed; evidence/package artifacts were preserved for operator follow-up."
            exit 1
          }
          Write-Host "Physical Full baseline is verified."

