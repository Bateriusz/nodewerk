name: NW-01 Baseline & Deployment Risk Verification

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-and-contract-checks:
    name: Schema, Dependency Closure & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run NW-01 automated contract and schema test suite
        run: pytest -v

      - name: Run NW-01 ContractsOnly verification
        run: python tools/verify_nw01.py --mode ContractsOnly

  windows-reproducibility-and-fixtures:
    name: Windows 11 x64 Build, Reproducibility & Concrete Check Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Bootstrap exact NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath "$env:RUNNER_TEMP\nw01-bootstrap-provenance.json"

      - name: Export exact MSVC/SDK build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv

      - name: Verify exact pinned toolchain
        shell: pwsh
        run: pwsh ./tools/nw01/doctor.ps1

      - name: Run NW-01 contract test suite on Windows
        run: pytest -v

      - name: Verify NW-01 concrete build, reproducibility, dependency, and failure-recovery checks
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/run-build-checks.ps1
          -SummaryPath "$env:RUNNER_TEMP\nw01-build-checks.json"

      - name: Upload NW-01 build-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw01-windows-build-checks
          path: |
            ${{ runner.temp }}/nw01-bootstrap-provenance.json
            ${{ runner.temp }}/nw01-build-checks.json
            benchmarks/reproducibility/*.json
            benchmarks/ledgers/*.json
            benchmarks/toolchain-manifest.v1.json
          if-no-files-found: warn

  windows-physical-evidence:
    name: Physical Windows 11 x64 GPU Evidence & CleanSystem Package
    if: vars.NW_PHYSICAL_RUNNER_LABEL != ''
    runs-on: ${{ vars.NW_PHYSICAL_RUNNER_LABEL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Enter pinned physical-host build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv

      - name: Verify pinned physical-host toolchain
        shell: pwsh
        run: pwsh ./tools/nw01/doctor.ps1

      - name: Run NW-01 Full physical-evidence validation
        shell: pwsh
        run: |
          $summaryPath = Join-Path $env:RUNNER_TEMP "nw01-full-mode.json"
          python tools/verify_nw01.py --mode Full --summary-json $summaryPath
          $code = $LASTEXITCODE
          if (-not (Test-Path $summaryPath)) {
            Write-Error "Full mode did not produce a summary JSON (exit code $code)."
            exit 1
          }
          $summary = Get-Content -Raw -Path $summaryPath | ConvertFrom-Json
          if ($code -eq 0) {
            Add-Content -Path $env:GITHUB_ENV -Value "NW_FULL_SUMMARY=$summaryPath"
            Write-Host "Full mode passed every concrete and physical-evidence check."
            exit 0
          }
          if ($code -eq 2) {
            $requiredChecks = @(
              "reproducibility_build",
              "msvc_ltcg_build",
              "clang_debug_symbols",
              "msvc_debug_symbols",
              "fixture_validation",
              "msvc_fixture_validation",
              "size_ledgers",
              "failure_recovery"
            )
            foreach ($name in $requiredChecks) {
              if ($summary.checks.$name.passed -ne $true) {
                Write-Error "Full mode exited 2 but required concrete check '$name' did not pass."
                exit 1
              }
            }
            Add-Content -Path $env:GITHUB_ENV -Value "NW_FULL_SUMMARY=$summaryPath"
            Write-Host "Full mode passed all concrete checks; only physical evidence remains unverified."
            exit 0
          }
          Write-Error "Full mode failed or skipped required build coverage (exit code $code)."
          exit 1

      - name: Package verified CleanSystem deployment
        shell: pwsh
        run: |
          $summaryPath = $env:NW_FULL_SUMMARY
          if ([string]::IsNullOrWhiteSpace($summaryPath)) {
            $summaryPath = Join-Path $env:RUNNER_TEMP "nw01-full-mode.json"
          }
          $artifactRoot = Join-Path $env:RUNNER_TEMP "nw01-clean-system-package"
          pwsh ./tools/package-clean-system.ps1 -FullSummary $summaryPath -OutputRoot $artifactRoot

      - name: Upload NW-01 clean-system deployment
        uses: actions/upload-artifact@v4
        with:
          name: nw01-clean-system-deploy-${{ github.sha }}
          path: ${{ runner.temp }}/nw01-clean-system-package/
          if-no-files-found: error
          retention-days: 14

      - name: Upload NW-01 physical evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw01-windows-physical-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nw01-full-mode.json
            benchmarks/reproducibility/*.json
            benchmarks/ledgers/*.json
            benchmarks/toolchain-manifest.v1.json
            benchmarks/hardware/*.json
            benchmarks/clean-system/*.json
          if-no-files-found: warn
          retention-days: 14
