name: NW-01 Baseline & Deployment Risk Verification

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]

jobs:
  schema-and-contract-checks:
    name: Schema, Dependency Closure & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run NW-01 automated contract and schema test suite
        run: pytest -v

      - name: Run NW-01 ContractsOnly verification
        run: python tools/verify_nw01.py --mode ContractsOnly

  windows-reproducibility-and-fixtures:
    name: Windows 11 x64 Build, Reproducibility & Verify Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Add Windows Kits DXC and LLVM to PATH
        shell: pwsh
        run: |
          $kitsDxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64\dxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($kitsDxc) {
            Add-Content -Path $env:GITHUB_PATH -Value $kitsDxc.DirectoryName
          }
          if (Test-Path "C:\Program Files\LLVM\bin") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"
          }

      - name: Run NW-01 contract test suite on Windows
        run: pytest -v

      - name: Verify NW-01 Full mode gate behavior
        shell: pwsh
        run: |
          & ./tools/verify-nw01.ps1 -Mode Full
          $code = $LASTEXITCODE
          if ($code -ne 0 -and $code -ne 2) {
            Write-Error "verify-nw01.ps1 -Mode Full failed with unexpected error exit code $code"
            exit $code
          }
          Write-Host "verify-nw01.ps1 -Mode Full exited with expected gate code $code"
          exit 0
