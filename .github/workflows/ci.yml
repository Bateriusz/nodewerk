name: NW-01 Baseline & Deployment Risk Verification

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]

jobs:
  schema-and-contract-checks:
    name: Schema, Dependency Closure & Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run NW-01 automated contract and schema test suite
        run: pytest -v

      - name: Run NW-01 ContractsOnly verification
        run: python tools/verify_nw01.py --mode ContractsOnly

  windows-reproducibility-and-fixtures:
    name: Windows 11 x64 Build, Reproducibility & Verify Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Add Windows Kits DXC and LLVM to PATH
        shell: pwsh
        run: |
          $kitsDxc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\10.0.*\x64\dxc.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($kitsDxc) {
            Add-Content -Path $env:GITHUB_PATH -Value $kitsDxc.DirectoryName
          }
          if (Test-Path "C:\Program Files\LLVM\bin") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\LLVM\bin"
          }

      - name: Run NW-01 contract test suite on Windows
        run: pytest -v

      - name: Verify NW-01 Full mode gate behavior
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP "nw01-full-mode.json"
          & ./tools/verify-nw01.ps1 -Mode Full *>&1 | Tee-Object -FilePath $reportPath
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Host "verify-nw01.ps1 -Mode Full passed."
            exit 0
          }
          if ($code -eq 2) {
            Write-Host "verify-nw01.ps1 -Mode Full exited 2: concrete build/schema/dependency/reproducibility/validation checks passed, but physical hardware or clean-system evidence remains unverified."
            exit 0
          }
          Write-Error "verify-nw01.ps1 -Mode Full detected concrete build, schema, dependency, reproducibility, or fixture-validation failure (exit code $code)."
          exit $code
