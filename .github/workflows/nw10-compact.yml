name: NW-10 Compact Export and Restricted Intro

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: NW-10 codec, accounting, profile, and evidence contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Configure frozen host compile gate
        run: >-
          cmake -S . -B build/nw10-frozen-host -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DNW_BUILD_PROFILE=release
          -DNW_ENFORCE_PINNED_TOOLCHAIN=OFF
      - name: Compile compact decoder in the frozen host path
        run: cmake --build build/nw10-frozen-host --target nw07_frozen_host_compile --parallel 2
      - name: Regenerate deterministic contract evidence twice
        env:
          NODEWERK_NW03_TEST_DIGEST: "1"
        run: |
          python tools/nw10_evidence.py --output-dir build/nw10-evidence-a
          python tools/nw10_evidence.py --output-dir build/nw10-evidence-b
      - name: Upload regenerated contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw10-regenerated-contract-evidence
          path: build/nw10-evidence-a/**
      - name: Run NW-10 contract tests
        run: python -m pytest -q tests/test_nw10_*.py
      - name: Verify deterministic contract evidence regeneration
        run: |
          python - <<'PY'
          from pathlib import Path
          names = (
              "compact-proof.v1.json",
              "intro-profile.v1.json",
              "evidence-status.v1.json",
              "proof-export-report.v1.json",
              "intro-export-report.v1.json",
          )
          for name in names:
              first = Path("build/nw10-evidence-a") / name
              second = Path("build/nw10-evidence-b") / name
              assert first.read_bytes() == second.read_bytes(), f"{name} regeneration is not deterministic"
          print("NW-10 contract evidence regenerates byte-identically")
          PY
      - name: Run the existing NW-07 contract verification
        run: python tools/verify_nw07.py --mode ContractsOnly --summary-json "$RUNNER_TEMP/nw07-contracts.json"
      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: nw10-contract-evidence
          path: |
            build/nw10-evidence/**
            ${{ runner.temp }}/nw07-contracts.json

  windows-compact-export:
    name: Windows x64 compact export attempt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Bootstrap exact NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath "$env:RUNNER_TEMP\nw10-bootstrap-provenance.json"
      - name: Export exact build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv
      - name: Configure release player template
        run: >-
          cmake --preset nw07-release
          -DNW10_COMPACT_PACKAGE=ON
          -DNW_ENFORCE_PINNED_TOOLCHAIN=ON
      - name: Build release player template
        run: cmake --build --preset nw07-release --target nw_procedural_image_player --parallel 2
      - name: Export canonical NW-07 proof and compact candidate
        shell: pwsh
        run: |
          $template = Join-Path $PWD "build/nw07-release/staging/procedural_image_player/nw_procedural_image_player.exe"
          if (-not (Test-Path $template -PathType Leaf)) {
            Write-Error "Release player template was not built: $template"
            exit 1
          }
          $dxc = (Get-Command dxc.exe -ErrorAction Stop).Source
          python tools/nw10_proof.py `
            --output "$PWD/build/nw10-proof" `
            --report "$PWD/build/nw10-proof/report.json" `
            --player-template $template `
            --dxc $dxc `
            --reproducibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/nw10_intro.py `
            --output "$PWD/build/nw10-intro" `
            --report "$PWD/build/nw10-intro/report.json" `
            --player-template $template `
            --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure single-file sizes
        shell: pwsh
        run: |
          $proof = Get-Content "$PWD/build/nw10-proof/report.json" | ConvertFrom-Json
          $intro = Get-Content "$PWD/build/nw10-intro/report.json" | ConvertFrom-Json
          $candidates = @()
          if ($proof.success -eq $true) {
            $proofBytes = [int64]$proof.compact_candidate.selected_executable_bytes
            $candidates += $proofBytes
            Write-Host ("NW-10 proof compact bytes: " + $proofBytes)
          } else {
            $proofBytes = [int64]$proof.measured_distribution_bytes
            $candidates += $proofBytes
            Write-Host ("NW-10 proof measured blocker bytes: " + $proofBytes)
          }
          $introBytes = [int64]$intro.compact_artifact.selected_executable_bytes
          $canonicalIntroBytes = [int64]$intro.canonical_artifact.executable_bytes
          $candidates += $introBytes
          Write-Host ("NW-10 intro compact candidate bytes: " + $introBytes)
          Write-Host ("NW-10 intro canonical bytes: " + $canonicalIntroBytes)
          $minimum = ($candidates | Measure-Object -Minimum).Minimum
          $outcome = [ordered]@{
            target_bytes = 65536
            minimum_measured_candidate_bytes = [int64]$minimum
            target_met = ([int64]$minimum -le 65536)
            classification = [string]$intro.decision.classification
            proof_measured_bytes = $proofBytes
            intro_compact_candidate_bytes = $introBytes
            intro_canonical_bytes = $canonicalIntroBytes
            minimum_validated_runnable_bytes = $null
            validated_mode = "pending_runtime_validation"
            compact_candidate_runtime_status = "pending"
            compact_candidate_exit_code = $null
            blockers = @()
            universal_64k_claim = $false
          }
          $outcome | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$PWD/build/nw10-windows-size-outcome.json"
      - name: Validate compact candidate, preserve canonical fallback, and check closure
        shell: pwsh
        run: |
          $runtimeDir = Join-Path $PWD "build/nw10-runtime"
          New-Item -ItemType Directory -Force -Path $runtimeDir | Out-Null
          $candidate = Get-ChildItem "$PWD/build/nw10-intro/compact/*.compact.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $canonical = Get-ChildItem "$PWD/build/nw10-intro/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $candidate) { Write-Error "Restricted-intro compact candidate was not emitted"; exit 1 }
          if ($null -eq $canonical) { Write-Error "Restricted-intro canonical fallback was not emitted"; exit 1 }

          $candidateStdout = Join-Path $runtimeDir "compact-candidate.stdout.txt"
          $candidateStderr = Join-Path $runtimeDir "compact-candidate.stderr.txt"
          $candidateProcess = Start-Process -FilePath $candidate.FullName -ArgumentList "--frames","2" -RedirectStandardOutput $candidateStdout -RedirectStandardError $candidateStderr -PassThru -Wait

          $outcomePath = Join-Path $PWD "build/nw10-windows-size-outcome.json"
          $outcome = Get-Content $outcomePath -Raw | ConvertFrom-Json
          $blockers = @()
          $selected = $candidate
          $validatedMode = "compact"
          if ($candidateProcess.ExitCode -eq 0) {
            $outcome.compact_candidate_runtime_status = "validated_runnable"
            Write-Host ("NW-10 compact candidate runtime validation: PASS (" + $candidate.Length + " bytes)")
          } else {
            $outcome.compact_candidate_runtime_status = "rejected_runtime_failure"
            $outcome.compact_candidate_exit_code = [int]$candidateProcess.ExitCode
            $blockers += [ordered]@{
              id = "compact_candidate_runtime"
              status = "rejected"
              exit_code = [int]$candidateProcess.ExitCode
              measured_bytes = [int64]$candidate.Length
              reason = "The measured compact packaging candidate failed hosted Windows runtime validation; it is retained as a tested blocker and is not counted as a validated runnable artifact."
            }
            Write-Warning ("NW-10 compact candidate rejected with exit code " + $candidateProcess.ExitCode + "; validating canonical fallback instead.")

            $canonicalStdout = Join-Path $runtimeDir "canonical-fallback.stdout.txt"
            $canonicalStderr = Join-Path $runtimeDir "canonical-fallback.stderr.txt"
            $canonicalProcess = Start-Process -FilePath $canonical.FullName -ArgumentList "--frames","2" -RedirectStandardOutput $canonicalStdout -RedirectStandardError $canonicalStderr -PassThru -Wait
            if ($canonicalProcess.ExitCode -ne 0) {
              Write-Error ("Canonical fallback failed with exit code " + $canonicalProcess.ExitCode)
              exit $canonicalProcess.ExitCode
            }
            $selected = $canonical
            $validatedMode = "canonical_fallback"
            Write-Host ("NW-10 canonical fallback runtime validation: PASS (" + $canonical.Length + " bytes)")
          }

          $outcome.minimum_validated_runnable_bytes = [int64]$selected.Length
          $outcome.validated_mode = $validatedMode
          $outcome.blockers = $blockers
          $outcome.classification = "continue"
          $outcome | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 $outcomePath

          $closureRoot = Join-Path $PWD "build/nw10-dependency-check"
          Remove-Item $closureRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $closureRoot | Out-Null
          $closureExe = Join-Path $closureRoot "nw10_validated.exe"
          Copy-Item $selected.FullName $closureExe -Force
          python tools/dependency_check.py --binary $closureExe --deployment-root $closureRoot --profile compact_experiment --fixture nw10_validated > "$PWD/build/nw10-dependency-closure.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Write-Host "NW-10 Windows feasibility outcome:"
          Get-Content $outcomePath
      - name: Upload Windows NW-10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw10-windows-compact-evidence
          path: |
            build/nw10-proof/**
            build/nw10-intro/**
            build/nw10-windows-size-outcome.json
            build/nw10-dependency-closure.json
            build/nw10-dependency-check/**
            build/nw10-runtime/**
            ${{ runner.temp }}/nw10-bootstrap-provenance.json
