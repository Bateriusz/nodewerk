name: NW-10 Compact Export and Restricted Intro

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: NW-10 codec, accounting, profile, and evidence contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Configure frozen host compile gate
        run: >-
          cmake -S . -B build/nw10-frozen-host -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DNW_BUILD_PROFILE=release
          -DNW_ENFORCE_PINNED_TOOLCHAIN=OFF
      - name: Compile compact decoder in the frozen host path
        run: cmake --build build/nw10-frozen-host --target nw07_frozen_host_compile --parallel 2
      - name: Run NW-10 contract tests
        run: python -m pytest -q tests/test_nw10_*.py
      - name: Regenerate deterministic contract evidence
        env:
          NODEWERK_NW03_TEST_DIGEST: "1"
        run: |
          python tools/nw10_evidence.py --output-dir build/nw10-evidence
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name in ("compact-proof.v1.json", "intro-profile.v1.json", "evidence-status.v1.json"):
              built = Path("build/nw10-evidence") / name
              archived = Path("benchmarks/nw10") / name
              assert built.read_bytes() == archived.read_bytes(), f"{name} is not reproducible"
          print("NW-10 contract evidence is reproducible")
          PY
      - name: Run the existing NW-07 contract verification
        run: python tools/verify_nw07.py --mode ContractsOnly --summary-json "$RUNNER_TEMP/nw07-contracts.json"
      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: nw10-contract-evidence
          path: |
            build/nw10-evidence/**
            ${{ runner.temp }}/nw07-contracts.json

  windows-compact-export:
    name: Windows x64 compact export attempt
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Bootstrap exact NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath "$env:RUNNER_TEMP\nw10-bootstrap-provenance.json"
      - name: Export exact build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv
      - name: Configure release player template
        run: cmake --preset nw07-release -DNW_ENFORCE_PINNED_TOOLCHAIN=ON
      - name: Build release player template
        run: cmake --build --preset nw07-release --target nw_procedural_image_player --parallel 2
      - name: Export canonical NW-07 proof and compact candidate
        shell: pwsh
        run: |
          $template = Join-Path $PWD "build/nw07-release/staging/procedural_image_player/nw_procedural_image_player.exe"
          if (-not (Test-Path $template -PathType Leaf)) {
            Write-Error "Release player template was not built: $template"
            exit 1
          }
          $dxc = (Get-Command dxc.exe -ErrorAction Stop).Source
          python tools/nw10_proof.py `
            --output "$PWD/build/nw10-proof" `
            --report "$PWD/build/nw10-proof/report.json" `
            --player-template $template `
            --dxc $dxc `
            --reproducibility
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/nw10_intro.py `
            --output "$PWD/build/nw10-intro" `
            --report "$PWD/build/nw10-intro/report.json" `
            --player-template $template `
            --dxc $dxc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Measure measured single-file sizes and dependency closure
        shell: pwsh
        run: |
          $proof = Get-Content "$PWD/build/nw10-proof/report.json" | ConvertFrom-Json
          $intro = Get-Content "$PWD/build/nw10-intro/report.json" | ConvertFrom-Json
          Write-Host ("NW-10 proof compact bytes: " + $proof.compact_candidate.selected_executable_bytes)
          Write-Host ("NW-10 intro compact bytes: " + $intro.compact_artifact.selected_executable_bytes)
          $exe = Get-ChildItem "$PWD/build/nw10-proof/compact/*.compact.exe" | Select-Object -First 1
          if ($null -eq $exe) { Write-Error "Compact executable was not emitted"; exit 1 }
          python tools/dependency_check.py --binary $exe.FullName > "$PWD/build/nw10-proof/dependency-closure.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-run compact proof artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$PWD/build/nw10-proof/compact/*.compact.exe" | Select-Object -First 1
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--frames","2" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Error "Compact proof executable failed with exit code $($process.ExitCode)"
            exit $process.ExitCode
          }
      - name: Upload Windows NW-10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw10-windows-compact-evidence
          path: |
            build/nw10-proof/**
            build/nw10-intro/**
            ${{ runner.temp }}/nw10-bootstrap-provenance.json
