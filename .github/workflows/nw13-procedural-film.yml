name: NW-13 Procedural Film

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-impact:
    name: NW-13 CI impact routing
    runs-on: ubuntu-latest
    outputs:
      nw13: ${{ steps.classify.outputs.nw13 }}
      full_regression: ${{ steps.classify.outputs.full_regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify changed scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci/changed_scope.py
          --event-name "${{ github.event_name }}"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --summary-file "$GITHUB_STEP_SUMMARY"

  contracts-and-headless-images:
    name: Catalog, contracts, headless images and evidence bundles
    needs: ci-impact
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify pinned catalog regeneration and clean-room boundary
        run: python tools/operator_catalog.py
      - name: Run NW-13 contract, geometry, scene, particle, audio and pipeline tests
        run: >-
          python -m pytest -v
          tests/test_nw13_geometry.py
          tests/test_nw13_geometry_graph_cpp.py
          tests/test_nw13_scene_animation.py
          tests/test_nw13_particles_effects.py
          tests/test_nw13_audio.py
          tests/test_nw13_pipeline_and_lowering.py
          tests/test_nw13_production_render.py
          tests/test_nw13_provenance_and_catalog.py
      - name: Regenerate fixed-tick frames and contact sheet
        run: |
          PYTHONPATH=tools python - <<'PY'
          from pathlib import Path
          import json
          import nw13_production as production
          root = Path('.').resolve()
          document = production.load_production(root, 'fixtures/nw13/hotel_corridor.production.json')
          manifest = production.render_evidence(root, document, output_dir='build/nw13-evidence')
          print(json.dumps(manifest['contact_sheet'], sort_keys=True))
          PY
      - name: Export independent common/optional/fallback artifacts and matched ledger
        run: >-
          env PYTHONPATH=tools python tools/nw13_artifact_measure.py
          --output-dir build/nw13-evidence
      - name: Upload NW-13 evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: nw13-evidence-${{ github.sha }}
          path: build/nw13-evidence/
          if-no-files-found: error
          retention-days: 14

  headless-warp-and-evidence:
    name: Windows builds, shared WARP regression, package identity and validation bundle
    needs: ci-impact
    if: needs.ci-impact.outputs.nw13 == 'true' || needs.ci-impact.outputs.full_regression == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Restore pinned portable-tool payload cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\nw01-download-cache
          key: nw13-pinned-toolchain-${{ runner.os }}-${{ hashFiles('benchmarks/toolchain-manifest.v1.json') }}
      - name: Export portable-tool payload cache root
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "nw01-download-cache"
          "NW01_DOWNLOAD_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Bootstrap exact NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath build/nw01-bootstrap.json
      - name: Export the pinned MSVC/SDK build environment
        shell: pwsh
        run: pwsh tools/nw01/enter-build-env.ps1 -ExportGitHubEnv
      - name: Configure the frozen NW-07 release build
        run: cmake --preset nw07-release -DNW_ENFORCE_PINNED_TOOLCHAIN=ON
      - name: Build portable PackagePlayer, capability checker and standalone player
        run: |
          cmake --build --preset nw07-release --target nw06_capability_check --parallel 2
          cmake --build --preset nw07-release --target nw_procedural_image_player --parallel 2
      - name: Run NW-13 contracts on Windows
        run: >-
          python -m pytest -v
          tests/test_nw13_geometry.py
          tests/test_nw13_geometry_graph_cpp.py
          tests/test_nw13_scene_animation.py
          tests/test_nw13_particles_effects.py
          tests/test_nw13_audio.py
          tests/test_nw13_pipeline_and_lowering.py
          tests/test_nw13_production_render.py
          tests/test_nw13_provenance_and_catalog.py
      - name: Preserve the shared NW-11 headless WARP command-path regression
        run: python -m pytest -q tests/test_nw11_advanced_gpu.py -k "warp or common_regression"
      - name: Independently export, smoke-test and measure common/optional artifacts
        shell: pwsh
        run: |
          $template = Join-Path $PWD "build/nw07-release/staging/procedural_image_player/nw_procedural_image_player.exe"
          if (-not (Test-Path $template)) { throw "nw_procedural_image_player.exe was not built" }
          $dxc = (Get-Command dxc.exe -ErrorAction Stop).Source
          $env:PYTHONPATH = "tools"
          python tools/nw13_artifact_measure.py `
            --output-dir build/nw13-evidence `
            --template $template `
            --dxc $dxc
      - name: Upload validation bundle
        uses: actions/upload-artifact@v4
        with:
          name: nw13-windows-validation-${{ github.sha }}
          path: build/nw13-evidence/
          if-no-files-found: error
          retention-days: 14
