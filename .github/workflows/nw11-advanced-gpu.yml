name: NW-11 Advanced GPU Feature Experiments

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: "NW-11 experiment to validate physically (mesh or ray)"
        required: false
        default: "nw11.mesh-shader-vs-indexed.v1"
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-impact:
    name: NW-11 impact routing
    runs-on: ubuntu-latest
    outputs:
      nw11: ${{ steps.classify.outputs.nw11 }}
      full_regression: ${{ steps.classify.outputs.full_regression }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify changed scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci/changed_scope.py
          --event-name "${{ github.event_name }}"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --summary-file "$GITHUB_STEP_SUMMARY"

  contract-and-capability-checks:
    name: Contract, capability-manifest, absence, stripping & reproducibility checks
    needs: ci-impact
    if: needs.ci-impact.outputs.nw11 == 'true' || needs.ci-impact.outputs.full_regression == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile NW-11 Python implementation
        run: >-
          python -m compileall -q
          tools/nw11_contract.py tools/nw11_capability.py tools/nw11_experiment.py
          tools/nw11_bundle.py tools/nw11_evidence.py tools/nw11_followup.py
          tools/nw11_build_bundle.py tools/nw11_verify.py tools/nw11_graph_scene.py
          tools/nw11_toolchain_identity.py tools/nw11_shader_payloads.py
          tools/nw11_pe_dependencies.py
          tools/nw11/collect-evidence.py tools/nw11/compare-captures.py
      - name: Validate schemas and tracked evidence state
        run: |
          python tools/schema_validator.py
          python tools/nw11_verify.py self-check
      - name: Run NW-11 contract tests
        run: pytest -q -k nw11
      - name: Absent-feature, malformed-manifest, stale-evidence & zero-cost stripping checks
        run: pytest -q -k "nw11 and (capability_absence or malformed or stale or zero_cost or initialization_failure)"
      - name: Reproducibility and per-device decision isolation checks
        run: pytest -q -k "nw11 and (deterministic or isolation or device or shader_manifest or graph_scene or fallback)"

  windows-experiment-build:
    name: Build NW-11 experiment executables
    needs: ci-impact
    if: needs.ci-impact.outputs.nw11 == 'true' || needs.ci-impact.outputs.full_regression == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute pinned portable-tool cache key
        id: nw01-portable-cache-key
        shell: pwsh
        run: >-
          python tools/ci/portable_cache_key.py
          --runner-os "${{ runner.os }}"
          --runner-arch "${{ runner.arch }}"
          --github-output "$env:GITHUB_OUTPUT"
      - name: Restore pinned portable-tool payload cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\nw01-download-cache
          key: ${{ steps.nw01-portable-cache-key.outputs.key }}
      - name: Export portable-tool payload cache root
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "nw01-download-cache"
          "NW01_DOWNLOAD_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Provision the pinned NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh tools/nw01/bootstrap-windows.ps1
          -Ci -SkipLlvm -ProvenancePath build/nw01-bootstrap.json
      - name: Export the pinned MSVC/SDK build environment
        shell: pwsh
        run: pwsh tools/nw01/enter-build-env.ps1 -ExportGitHubEnv -SkipLlvm
      - name: Confirm pinned offline DXC is available
        shell: pwsh
        run: |
          $dxc = Get-Command dxc.exe -ErrorAction Stop
          & $dxc.Source --version
      - name: Configure optional-profile experiment tools
        shell: pwsh
        run: |
          $cl = (Get-Command cl.exe -ErrorAction Stop).Source
          $dxc = (Get-Command dxc.exe -ErrorAction Stop).Source
          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          cmake -S src/nw11 -B build/nw11-experiments -G Ninja "-DCMAKE_BUILD_TYPE=Release" "-DCMAKE_CXX_COMPILER=$cl" "-DCMAKE_MAKE_PROGRAM=$ninja" "-DNW11_DXC_EXECUTABLE=$dxc"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build capability probe and experiment executables
        run: >-
          cmake --build build/nw11-experiments --parallel 2
          --target nw11_capability_probe nw11_common_baseline nw11_common_analytic
          nw11_fallback_common nw11_fallback_analytic nw11_optional_mesh
          nw11_optional_ray
      - name: Launch every artifact in self-check mode
        shell: pwsh
        run: |
          $root = "build/nw11-experiments"
          foreach ($name in @("nw11_capability_probe", "nw11_common_baseline", "nw11_common_analytic", "nw11_fallback_common", "nw11_fallback_analytic", "nw11_optional_mesh", "nw11_optional_ray")) {
            $exe = Get-ChildItem -Recurse $root -Filter "$name.exe" | Select-Object -First 1
            if (-not $exe) { throw "missing $name.exe" }
            & $exe.FullName --self-check
            if ($LASTEXITCODE -ne 0) { throw "$name self-check failed" }
          }
      - name: Stage same-revision executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/nw11-artifacts | Out-Null
          foreach ($name in @("nw11_capability_probe", "nw11_common_baseline", "nw11_common_analytic", "nw11_fallback_common", "nw11_fallback_analytic", "nw11_optional_mesh", "nw11_optional_ray")) {
            $exe = Get-ChildItem -Recurse "build/nw11-experiments" -Filter "$name.exe" | Select-Object -First 1
            if (-not $exe) { throw "missing $name.exe" }
            Copy-Item $exe.FullName "build/nw11-artifacts/$name.exe"
          }
          Copy-Item "build/nw11-experiments/generated/nw11_scene_generated.json" "build/nw11-artifacts/nw11_scene_generated.json"
      - name: Record measured toolchain, DXIL payloads, and PE dependencies
        shell: pwsh
        run: |
          $dxc = Get-Command dxc.exe -ErrorAction Stop
          $cache = Get-Content "build/nw11-experiments/CMakeCache.txt"
          $compilerLine = $cache | Where-Object { $_ -like "CMAKE_CXX_COMPILER:*" } | Select-Object -First 1
          $compiler = $compilerLine.Split("=", 2)[1]
          if (-not $compiler) { throw "CMake compiler identity missing" }
          $activeCl = (Get-Command cl.exe -ErrorAction Stop).Source
          if ((Resolve-Path $compiler).Path -ne (Resolve-Path $activeCl).Path) { throw "CMake did not use pinned active MSVC" }
          if (-not $env:WindowsSDKVersion) { throw "Pinned SDK environment is missing" }
          $sdkVersion = $env:WindowsSDKVersion.TrimEnd('\')
          $pins = Get-Content "benchmarks/toolchain-manifest.v1.json" -Raw | ConvertFrom-Json
          if ($sdkVersion -ne $pins.pinned_dependencies.windows_sdk_version) { throw "Active SDK does not match pinned SDK" }
          python tools/nw11_toolchain_identity.py `
            --dxc $dxc.Source `
            --cl $compiler `
            --cmake cmake `
            --ninja ninja `
            --windows-sdk-version $sdkVersion `
            --out "build/nw11-artifacts/nw11-toolchain-identity.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/nw11_shader_payloads.py `
            --directory "build/nw11-experiments/shaders" `
            --out "build/nw11-artifacts/nw11-shader-payloads.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/nw11_pe_dependencies.py `
            --exe "build/nw11-artifacts/nw11_capability_probe.exe" `
            --exe "build/nw11-artifacts/nw11_common_baseline.exe" `
            --exe "build/nw11-artifacts/nw11_common_analytic.exe" `
            --exe "build/nw11-artifacts/nw11_fallback_common.exe" `
            --exe "build/nw11-artifacts/nw11_fallback_analytic.exe" `
            --exe "build/nw11-artifacts/nw11_optional_mesh.exe" `
            --exe "build/nw11-artifacts/nw11_optional_ray.exe" `
            --out "build/nw11-artifacts/nw11-pe-dependencies.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload same-revision build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nw11-executables-${{ github.sha }}
          path: build/nw11-artifacts/**
          if-no-files-found: error

  windows-runtime-smoke:
    name: NW-11 D3D12 command-path smoke (hosted WARP)
    needs: [ci-impact, windows-experiment-build]
    if: needs.windows-experiment-build.result == 'success'
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nw11-executables-${{ github.sha }}
          path: build/nw11-artifacts
      - name: Exercise common and fallback D3D12 paths on WARP
        shell: pwsh
        run: |
          foreach ($name in @("nw11_common_baseline", "nw11_common_analytic", "nw11_fallback_common", "nw11_fallback_analytic")) {
            $reportPath = "build/$name-warp-smoke.json"
            & "build/nw11-artifacts/$name.exe" --allow-software --benchmark-json $reportPath --warmup-seconds 0 --runs 1 --run-seconds 1
            if ($LASTEXITCODE -ne 0) { throw "$name WARP command-path smoke failed" }
            $report = Get-Content $reportPath -Raw | ConvertFrom-Json
            if ($report.measurement.gpu_time_samples.Count -lt 1) {
              throw "$name WARP smoke produced no GPU timestamp samples"
            }
          }

  build-validation-bundles:
    name: Build immutable validation bundle (${{ matrix.experiment }})
    needs: [ci-impact, windows-experiment-build, windows-runtime-smoke]
    if: needs.windows-runtime-smoke.result == 'success'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - experiment: nw11.mesh-shader-vs-indexed.v1
            variant: nw11_optional_mesh.exe
            baseline: nw11_common_baseline.exe
            fallback: nw11_fallback_common.exe
            slug: mesh
          - experiment: nw11.ray-query-vs-analytic-reflection.v1
            variant: nw11_optional_ray.exe
            baseline: nw11_common_analytic.exe
            fallback: nw11_fallback_analytic.exe
            slug: ray-query
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download same-revision executables
        uses: actions/download-artifact@v4
        with:
          name: nw11-executables-${{ github.sha }}
          path: build/nw11-artifacts
      - name: Record the tested revision
        id: revision
        shell: pwsh
        run: |
          $commit = (git rev-parse HEAD).Trim()
          if ($commit -ne "${{ github.sha }}") { throw "checkout HEAD does not match github.sha" }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Build deterministic bundle from repository artifacts
        shell: pwsh
        run: |
          python tools/nw11_build_bundle.py `
            --output build/nw11-bundle-${{ matrix.slug }} `
            --experiment-id "${{ matrix.experiment }}" `
            --commit "${{ steps.revision.outputs.commit }}" `
            --require-head `
            --baseline-executable "build/nw11-artifacts/${{ matrix.baseline }}" `
            --variant-executable "build/nw11-artifacts/${{ matrix.variant }}" `
            --fallback-executable "build/nw11-artifacts/${{ matrix.fallback }}" `
            --capability-probe "build/nw11-artifacts/nw11_capability_probe.exe" `
            --graph-scene "build/nw11-artifacts/nw11_scene_generated.json" `
            --toolchain-identity "build/nw11-artifacts/nw11-toolchain-identity.json" `
            --shader-payloads "build/nw11-artifacts/nw11-shader-payloads.json" `
            --dependency-report "build/nw11-artifacts/nw11-pe-dependencies.json" `
            --json-out "build/nw11-bundle-${{ matrix.slug }}-manifest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/nw11_verify.py bundle `
            --bundle-root "build/nw11-bundle-${{ matrix.slug }}" `
            --expected-commit "${{ steps.revision.outputs.commit }}" `
            --json-out "build/nw11-bundle-${{ matrix.slug }}-verification.json"
      - name: Upload immutable bundle
        uses: actions/upload-artifact@v4
        with:
          name: nw11-validation-bundle-${{ matrix.slug }}-${{ github.sha }}
          path: build/nw11-bundle-${{ matrix.slug }}/**
          if-no-files-found: error

  physical-validation:
    name: Physical validation (${{ matrix.device_tier }} / ${{ matrix.slug }})
    if: github.event_name == 'workflow_dispatch'
    needs: build-validation-bundles
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_tier: desktop_ada_representative
            slug: mesh
          - device_tier: desktop_ada_representative
            slug: ray-query
          - device_tier: desktop_blackwell_representative
            slug: mesh
          - device_tier: desktop_blackwell_representative
            slug: ray-query
    runs-on:
      - self-hosted
      - windows
      - nw11-${{ matrix.device_tier }}
    steps:
      - name: Download the CI-built immutable bundle
        uses: actions/download-artifact@v4
        with:
          name: nw11-validation-bundle-${{ matrix.slug }}-${{ github.sha }}
          path: ${{ runner.temp }}/nw11-bundle-${{ matrix.slug }}
      - name: Verify and execute the immutable bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "nw11-bundle-${{ matrix.slug }}"
          $launcher = Join-Path $bundle "run-validation.ps1"
          if (-not (Test-Path -LiteralPath $launcher)) { throw "bundle launcher is missing" }
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP "nw11-evidence-${{ matrix.device_tier }}-${{ matrix.slug }}"
          & $launcher `
            -BundleRoot $bundle `
            -ExpectedCommit "${{ github.sha }}" `
            -DeviceTier "${{ matrix.device_tier }}" `
            -OutputDirectory $evidenceDirectory
          $code = $LASTEXITCODE
          if ($code -eq 0) { exit 0 }
          if ($code -eq 3) { Write-Host "Capability absence is explicitly unsupported."; exit 3 }
          if ($code -eq 11) { Write-Host "Required device coverage remains pending."; exit 11 }
          if ($code -eq 10) { Write-Host "Measured decision is rejected; evidence is preserved."; exit 0 }
          throw "NW-11 physical validation failed with exit code $code"
      - name: Upload raw evidence and decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw11-evidence-${{ matrix.device_tier }}-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/nw11-evidence-${{ matrix.device_tier }}-${{ matrix.slug }}/**
          if-no-files-found: warn
