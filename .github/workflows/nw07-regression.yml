name: NW-07 256 KiB Architectural Proof Regression

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  per-change-checks:
    name: Per-change CPU, compiler, reproducibility and size checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      # Fast fail: compile production-shaped frozen specialization before Python gates.
      # Compile the exact frozen C++ branches before contract tests so
      # preprocessor/syntax regressions cannot be masked by a stale freeze.
      - name: Configure NW-07 frozen host compile gate
        run: >-
          cmake -S . -B build/nw07-frozen-host -G Ninja
          -DCMAKE_BUILD_TYPE=MinSizeRel
          -DNW_BUILD_PROFILE=release
          -DNW_ENFORCE_PINNED_TOOLCHAIN=OFF
      - name: Compile exact NW-07 frozen host path
        run: cmake --build build/nw07-frozen-host --target nw07_frozen_host_compile --parallel 2
      - name: Run NW-07 contract and regression tests
        run: python -m pytest -q tests/test_nw07_*.py
      - name: Run NW-07 ContractsOnly verification
        run: >-
          python tools/verify_nw07.py --mode ContractsOnly
          --summary-json "$RUNNER_TEMP/nw07-contracts.json"
      - name: Run NW-07 BuildChecks verification (native export pending off Windows)
        # BuildChecks intentionally reports pending_unverified (exit 2) when the
        # Windows-only release export has no Windows host, DXC, or player
        # template.  ContractsOnly above already exercises the GPU-less
        # contracts, reproducibility, and size accounting.  Treat only the
        # documented pending state as expected on Linux; an executed failure
        # (exit 1) must still fail the job.
        shell: bash
        run: |
          set +e
          python tools/verify_nw07.py --mode BuildChecks \
            --summary-json "$RUNNER_TEMP/nw07-build-checks.json"
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::notice::NW-07 BuildChecks reported pending native Windows release export on ubuntu-latest; ContractsOnly covered the GPU-less contracts, reproducibility, and size checks."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::NW-07 BuildChecks exited with status $status"
            exit "$status"
          fi
      - name: Upload NW-07 contract summary
        uses: actions/upload-artifact@v4
        with:
          name: nw07-contract-summary
          path: |
            ${{ runner.temp }}/nw07-contracts.json
            ${{ runner.temp }}/nw07-build-checks.json

  windows-release-build:
    name: Windows x64 release export and diagnostic sibling build
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Bootstrap exact NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath "$env:RUNNER_TEMP\nw07-bootstrap-provenance.json"
      - name: Export exact MSVC/SDK build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv
      - name: Configure NW-07 release build
        run: cmake --preset nw07-release -DNW_ENFORCE_PINNED_TOOLCHAIN=ON
      - name: Configure NW-07 diagnostic sibling build
        run: cmake --preset nw07-diagnostics -DNW_ENFORCE_PINNED_TOOLCHAIN=ON
      - name: Build release player template
        run: cmake --build --preset nw07-release --target nw_procedural_image_player --parallel 2
      - name: Build diagnostic capture sibling
        run: cmake --build --preset nw07-diagnostics --target nw_procedural_image_player --parallel 2
      - name: Run NW-07 BuildChecks
        shell: pwsh
        run: |
          $template = Join-Path $PWD "build/nw07-release/staging/procedural_image_player/nw_procedural_image_player.exe"
          if (-not (Test-Path $template -PathType Leaf)) {
            Write-Error "NW-07 release player template was not built: $template"
            exit 1
          }
          $diagnostic = Join-Path $PWD "build/nw07-diagnostics/staging/procedural_image_player/nw_procedural_image_player.exe"
          if (-not (Test-Path $diagnostic -PathType Leaf)) {
            Write-Error "NW-07 diagnostic sibling player was not built: $diagnostic"
            exit 1
          }
          $dxc = (Get-Command dxc.exe -ErrorAction Stop).Source
          python tools/verify_nw07.py --mode BuildChecks `
            --player-template $template `
            --dxc $dxc `
            --native-output "$PWD/build/nw07-distribution" `
            --summary-json "$env:RUNNER_TEMP\nw07-build-checks.json"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NW-07 BuildChecks failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
      - name: Upload NW-07 Windows build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw07-windows-build-checks
          path: |
            ${{ runner.temp }}/nw07-build-checks.json
            ${{ runner.temp }}/nw07-bootstrap-provenance.json
            build/nw07-distribution/**

  nightly-gpu-check:
    name: Nightly matched-environment GPU regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # These self-hosted labels identify the frozen NW-07 reference and
    # development-series hosts.  A generic VM is never sufficient for GPU
    # acceptance.
    runs-on: [self-hosted, windows, x64, nw07-gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect nightly GPU measurements before validation
        env:
          NW07_PACKAGE: ${{ vars.NW07_PACKAGE }}
          NW07_EXECUTABLE: ${{ vars.NW07_FIXTURE }}
          NW07_COLLECTOR_COMMAND: ${{ vars.NW07_COLLECTOR_COMMAND }}
          NW07_REFERENCE: ${{ vars.NW07_REFERENCE }}
          NW07_PERF_CONTRACT: ${{ vars.NW07_PERF_CONTRACT }}
          NW07_EVIDENCE: ${{ vars.NW07_EVIDENCE }}
        run: >-
          python tools/nw07_capture.py collect
          --package "$env:NW07_PACKAGE"
          --executable "$env:NW07_EXECUTABLE"
          --samples-dir "$env:RUNNER_TEMP\nw07-nightly-samples"
          --contract "$env:NW07_PERF_CONTRACT"
          --reference "$env:NW07_REFERENCE"
          --collector-command "$env:NW07_COLLECTOR_COMMAND"
          --capture-id "nightly-$env:GITHUB_RUN_ID"
          --evidence "$env:NW07_EVIDENCE"
      - name: Collect fresh fixed-tick visual, startup and memory evidence
        env:
          NW07_PACKAGE: ${{ vars.NW07_PACKAGE }}
          NW07_FIXTURE: ${{ vars.NW07_FIXTURE }}
          NW07_DIAGNOSTIC_EXECUTABLE: ${{ vars.NW07_DIAGNOSTIC_EXECUTABLE }}
          NW07_RELEASE_CAPTURE_COMMAND: ${{ vars.NW07_RELEASE_CAPTURE_COMMAND }}
          NW07_STARTUP_MS: ${{ vars.NW07_STARTUP_MS }}
          NW07_PEAK_GPU_BYTES: ${{ vars.NW07_PEAK_GPU_BYTES }}
          NW07_PROCESS_RAM_BYTES: ${{ vars.NW07_PROCESS_RAM_BYTES }}
          NW07_DRIVER_MEMORY_BYTES: ${{ vars.NW07_DRIVER_MEMORY_BYTES }}
          NW07_STARTUP_PIPELINE_MS: ${{ vars.NW07_STARTUP_PIPELINE_MS }}
          NW07_GENERATION_MS: ${{ vars.NW07_GENERATION_MS }}
          NW07_IMAGE_QUALITY: ${{ vars.NW07_IMAGE_QUALITY }}
          NW07_SCALING_1440P: ${{ vars.NW07_SCALING_1440P }}
          NW07_METRICS_COMMAND: ${{ vars.NW07_METRICS_COMMAND }}
          NW07_EVIDENCE: ${{ vars.NW07_EVIDENCE }}
        run: >-
          python tools/nw07_capture.py release-correctness
          --package "$env:NW07_PACKAGE"
          --executable "$env:NW07_FIXTURE"
          --diagnostic-executable "$env:NW07_DIAGNOSTIC_EXECUTABLE"
          --capture-command "$env:NW07_RELEASE_CAPTURE_COMMAND"
          --captures-dir "$env:RUNNER_TEMP\nw07-nightly-captures"
          --reference-captures-dir "$env:RUNNER_TEMP\nw07-nightly-reference-captures"
          --reference-execution-output "$env:RUNNER_TEMP\nw07-nightly-reference.json"
          --capture-id "nightly-correctness-$env:GITHUB_RUN_ID"
          --tier ada
          --device-form-factor desktop
          --startup-ms "$env:NW07_STARTUP_MS"
          --peak-gpu-bytes "$env:NW07_PEAK_GPU_BYTES"
          --cache-kind cold_driver_cache
          --cold-preparation "Driver cache cleared before the clean run."
          --warm-preparation "Artifact pre-run once before the warm run."
          --memory-source "engine accounting plus driver local usage query"
          --process-ram-bytes "$env:NW07_PROCESS_RAM_BYTES"
          --driver-memory-bytes "$env:NW07_DRIVER_MEMORY_BYTES"
          --startup-pipeline-ms "$env:NW07_STARTUP_PIPELINE_MS"
          --generation-ms "$env:NW07_GENERATION_MS"
          --image-quality "$env:NW07_IMAGE_QUALITY"
          --scaling-1440p "$env:NW07_SCALING_1440P"
          --metrics-command "$env:NW07_METRICS_COMMAND"
          --metrics-output "$env:RUNNER_TEMP\nw07-nightly-measurements.json"
          --evidence "$env:NW07_EVIDENCE"
      - name: Re-run clean-system deployment qualification
        env:
          NW07_FIXTURE: ${{ vars.NW07_FIXTURE }}
          NW07_PACKAGE: ${{ vars.NW07_PACKAGE }}
          NW07_BINARY_DIR: ${{ vars.NW07_BINARY_DIR }}
          NW07_CLEAN_REPORT: ${{ vars.NW07_CLEAN_REPORT }}
        run: >-
          python tools/nw07_clean_system.py
          --fixture "$env:NW07_FIXTURE"
          --package "$env:NW07_PACKAGE"
          --deployment "$env:NW07_BINARY_DIR"
          --output "$env:NW07_CLEAN_REPORT"
      - name: Run NW-07 Full verification on the reference host
        env:
          NW07_FIXTURE: ${{ vars.NW07_FIXTURE }}
          NW07_PACKAGE: ${{ vars.NW07_PACKAGE }}
          NW07_EVIDENCE: ${{ vars.NW07_EVIDENCE }}
          NW07_BUILD_REPORT: ${{ vars.NW07_BUILD_REPORT }}
          NW07_PERF_CONTRACT: ${{ vars.NW07_PERF_CONTRACT }}
          NW07_BINARY_DIR: ${{ vars.NW07_BINARY_DIR }}
          NW07_CLEAN_REPORT: ${{ vars.NW07_CLEAN_REPORT }}
        run: >-
          python tools/verify_nw07.py --mode Full
          --fixture "$env:NW07_FIXTURE"
          --package "$env:NW07_PACKAGE"
          --evidence "$env:NW07_EVIDENCE"
          --build-report "$env:NW07_BUILD_REPORT"
          --perf-ref "$env:NW07_PERF_CONTRACT"
          --binary-dir "$env:NW07_BINARY_DIR"
          --clean-report "$env:NW07_CLEAN_REPORT"
          --max-evidence-age-seconds 86400
          --summary-json "$env:RUNNER_TEMP\nw07-full.json"
      - name: Evaluate matched-environment regression policy
        run: |
          python -m pytest -q tests/test_nw07_regression_verify.py
          if (Test-Path "$env:NW07_METRICS") {
            python tools/nw07_regression.py `
              --baseline benchmarks/nw07/metric-baselines.v1.json `
              --current "$env:NW07_METRICS" `
              --summary-json "$env:RUNNER_TEMP\nw07-regression.json"
          }
        env:
          NW07_METRICS: ${{ vars.NW07_METRICS }}
      - name: Upload NW-07 GPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nw07-nightly-evidence
          path: |
            ${{ runner.temp }}/nw07-full.json
            ${{ runner.temp }}/nw07-nightly-samples/**
            ${{ runner.temp }}/nw07-nightly-captures/**
            ${{ runner.temp }}/nw07-nightly-reference-captures/**
            ${{ runner.temp }}/nw07-nightly-reference.json
            ${{ vars.NW07_EVIDENCE }}
