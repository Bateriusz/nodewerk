name: NW-08 Studio Authoring Editor

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-contracts:
    name: Editor, cache identity, async and release-isolation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run NW-08 regression coverage
        run: python -m pytest -q tests/test_nw08_*.py
      - name: Run NW-08 ContractsOnly verification
        run: >-
          python tools/verify_nw08.py --mode ContractsOnly
          --summary-json "$RUNNER_TEMP/nw08-contracts.json"
      - name: Confirm frozen NW-07 contracts still pass
        run: |
          python -m pytest -q tests/test_nw07_export.py tests/test_nw07_regression_verify.py
          python tools/verify_nw07.py --mode ContractsOnly \
            --summary-json "$RUNNER_TEMP/nw07-contracts.json"
      - name: Upload NW-08 contract summary
        uses: actions/upload-artifact@v4
        with:
          name: nw08-contract-summary
          path: ${{ runner.temp }}/nw08-contracts.json

  windows-integration:
    name: Windows 11 x64 GUI/CLI, preview and device-recreation integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run NW-08 regression coverage
        run: python -m pytest -q tests/test_nw08_*.py
      - name: Run Windows integration validation
        shell: bash
        run: |
          set +e
          python tools/nw08_windows_integration.py \
            --report "$RUNNER_TEMP/nw08-windows-integration.json"
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::notice::NW-08 Windows integration is pending an explicit diagnostic player/preview executable; contract simulations are not hardware evidence."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::NW-08 Windows integration exited with status $status"
            exit "$status"
          fi
      - name: Upload NW-08 integration report
        uses: actions/upload-artifact@v4
        with:
          name: nw08-windows-integration
          path: ${{ runner.temp }}/nw08-windows-integration.json
