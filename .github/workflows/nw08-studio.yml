name: NW-08 Studio Authoring Editor

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editor-contracts:
    name: Editor, cache identity, async and release-isolation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run NW-08 regression coverage
        run: python -m pytest -q tests/test_nw08_*.py
      - name: Run NW-08 ContractsOnly verification
        run: >-
          python tools/verify_nw08.py --mode ContractsOnly
          --summary-json "$RUNNER_TEMP/nw08-contracts.json"
      - name: Confirm frozen NW-07 contracts still pass
        run: |
          python -m pytest -q tests/test_nw07_export.py tests/test_nw07_regression_verify.py
          python tools/verify_nw07.py --mode ContractsOnly \
            --summary-json "$RUNNER_TEMP/nw07-contracts.json"
      - name: Upload NW-08 contract summary
        uses: actions/upload-artifact@v4
        with:
          name: nw08-contract-summary
          path: ${{ runner.temp }}/nw08-contracts.json

  windows-integration:
    name: Windows 11 x64 GUI/CLI, preview and device-recreation integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Bootstrap exact NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath "$env:RUNNER_TEMP\nw01-bootstrap-nw08.json"
      - name: Export the pinned build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv
      - name: Build the nodewerk-studio-preview native host
        shell: pwsh
        run: |
          cmake -S tools/nw08_authoring_build -B build/nw08-authoring `
            -DNW_BUILD_PROFILE=dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/nw08-authoring --target nodewerk-studio-preview nw_procedural_image_player --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locate native runtime inputs
        shell: pwsh
        run: |
          $preview = Get-ChildItem build/nw08-authoring -Recurse -Filter nodewerk-studio-preview.exe |
            Select-Object -First 1
          $template = Get-ChildItem build/nw08-authoring -Recurse -Filter nw_procedural_image_player.exe |
            Select-Object -First 1
          $dxc = Get-Command dxc.exe -ErrorAction Stop
          if (-not $preview) { throw "nodewerk-studio-preview.exe was not built" }
          if (-not $template) { throw "nw_procedural_image_player.exe was not built" }
          "NW08_PREVIEW_EXE=$($preview.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NW08_PLAYER_TEMPLATE_EXE=$($template.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NW08_DXC_EXE=$($dxc.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run NW-08 regression coverage
        run: python -m pytest -q tests/test_nw08_*.py
      - name: Create deterministic contract-test toolchain
        shell: bash
        run: |
          python tools/nw08_test_toolchain.py \
            --directory "$RUNNER_TEMP/nw08-test-toolchain" \
            --report "$RUNNER_TEMP/nw08-test-toolchain.json"
      - name: Run Windows integration validation (real export path)
        shell: bash
        run: |
          set +e
          python tools/nw08_windows_integration.py \
            --dxc "$NW08_DXC_EXE" \
            --player-template "$NW08_PLAYER_TEMPLATE_EXE" \
            --preview-executable "$NW08_PREVIEW_EXE" \
            --preview-mode package-host \
            --execution-kind software_adapter \
            --allow-software-adapter \
            --report "$RUNNER_TEMP/nw08-windows-integration.json"
          status=$?
          set -e
          python - "$RUNNER_TEMP/nw08-windows-integration.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          checks = {entry["name"]: entry["status"] for entry in report["checks"]}
          required = {
              "gui_cli_export_equivalence",
              "shader_error_recovery",
              "device_recreation",
              "fence_safe_cache",
              "gui_window_interaction",
              "runtime_shader_error_recovery",
              "runtime_device_recreation",
              "runtime_fence_safe_cache",
              "real_preview",
          }
          failed = sorted(name for name in required if checks.get(name) != "passed")
          if failed:
              raise SystemExit("NW-08 integration checks failed: " + ", ".join(failed))
          if report["hardware_evidence"]:
              raise SystemExit(
                  "contract-test integration must not claim hardware evidence"
              )
          if checks.get("real_preview") != "passed":
              raise SystemExit("native software-adapter preview did not pass")
          print(
              "NW-08 native GUI/runtime recovery, device recreation, "
              "incremental GPU reuse and preview checks passed on WARP; "
              "no physical hardware evidence claimed."
          )
          PY
          if [ "$status" -eq 2 ]; then
            echo "::notice::NW-08 native runtime/GUI coverage passed on the software D3D12 adapter; physical hardware evidence remains pending."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::NW-08 Windows integration exited with status $status"
            exit "$status"
          fi
      - name: Upload NW-08 test toolchain
        uses: actions/upload-artifact@v4
        with:
          name: nw08-test-toolchain
          path: ${{ runner.temp }}/nw08-test-toolchain.json
      - name: Upload NW-08 integration report
        uses: actions/upload-artifact@v4
        with:
          name: nw08-windows-integration
          path: ${{ runner.temp }}/nw08-windows-integration.json

  windows-real-preview:
    name: Windows 11 x64 real preview (opt-in hardware host)
    if: ${{ vars.NW08_REAL_PREVIEW == '1' }}
    runs-on: windows-latest
    env:
      NW08_PREVIEW_EXECUTABLE: ${{ vars.NW08_PREVIEW_EXECUTABLE }}
      NW08_PLAYER_TEMPLATE: ${{ vars.NW08_PLAYER_TEMPLATE }}
      NW08_DXC: ${{ vars.NW08_DXC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run real preview integration
        shell: bash
        run: |
          python tools/nw08_windows_integration.py \
            --player-template "$NW08_PLAYER_TEMPLATE" \
            --dxc "$NW08_DXC" \
            --preview-executable "$NW08_PREVIEW_EXECUTABLE" \
            --preview-mode package-host \
            --execution-kind physical \
            --report "$RUNNER_TEMP/nw08-windows-real-preview.json"
      - name: Upload NW-08 real preview report
        uses: actions/upload-artifact@v4
        with:
          name: nw08-windows-real-preview
          path: ${{ runner.temp }}/nw08-windows-real-preview.json
