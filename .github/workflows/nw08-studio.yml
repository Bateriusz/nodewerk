name: Studio Authoring and Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-impact:
    name: CI impact routing
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.classify.outputs.core }}
      nw01: ${{ steps.classify.outputs.nw01 }}
      nw07: ${{ steps.classify.outputs.nw07 }}
      nw08: ${{ steps.classify.outputs.nw08 }}
      nw08a: ${{ steps.classify.outputs.nw08a }}
      nw10: ${{ steps.classify.outputs.nw10 }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_regression: ${{ steps.classify.outputs.full_regression }}
      fail_safe: ${{ steps.classify.outputs.fail_safe }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify changed scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python tools/ci/changed_scope.py
          --event-name "${{ github.event_name }}"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
          --summary-file "$GITHUB_STEP_SUMMARY"
  editor-contracts:
    needs: ci-impact
    if: needs.ci-impact.outputs.nw08 == 'true'
    name: Editor, cache identity, async and release-isolation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run NW-08 regression coverage
        run: python -m pytest -q tests/test_nw08_*.py
      - name: Run NW-08 ContractsOnly verification
        run: >-
          python tools/verify_nw08.py --mode ContractsOnly
          --summary-json "$RUNNER_TEMP/nw08-contracts.json"
      - name: Confirm frozen NW-07 contracts still pass
        run: |
          python -m pytest -q tests/test_nw07_export.py tests/test_nw07_regression_verify.py
          python tools/verify_nw07.py --mode ContractsOnly \
            --summary-json "$RUNNER_TEMP/nw07-contracts.json"
      - name: Upload NW-08 contract summary
        uses: actions/upload-artifact@v4
        with:
          name: nw08-contract-summary
          path: ${{ runner.temp }}/nw08-contracts.json

  windows-integration:
    needs: ci-impact
    if: needs.ci-impact.outputs.nw08 == 'true'
    name: Windows 11 x64 GUI/CLI, preview and device-recreation integration
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compute pinned portable-tool cache key
        id: nw01-portable-cache-key
        shell: pwsh
        run: >-
          python tools/ci/portable_cache_key.py
          --runner-os "${{ runner.os }}"
          --runner-arch "${{ runner.arch }}"
          --github-output "$env:GITHUB_OUTPUT"

      - name: Restore pinned portable-tool payload cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\nw01-download-cache
          key: ${{ steps.nw01-portable-cache-key.outputs.key }}

      - name: Export portable-tool payload cache root
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP "nw01-download-cache"
          "NW01_DOWNLOAD_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Bootstrap exact NW-01 Windows toolchain
        shell: pwsh
        run: >-
          pwsh ./tools/nw01/bootstrap-windows.ps1
          -Ci
          -ProvenancePath "$env:RUNNER_TEMP\nw01-bootstrap-nw08.json"
      - name: Export the pinned build environment
        shell: pwsh
        run: pwsh ./tools/nw01/enter-build-env.ps1 -ExportGitHubEnv
      - name: Build the frozen runtime inputs and native authoring host
        shell: pwsh
        run: |
          # Reuse the already-qualified NW-07 release configure contract verbatim.
          # It pins MSVC, MinSizeRel, static MSVC runtime + inbox UCRT, and the
          # frozen release dependency policy. Do not create an ad-hoc release
          # build here: that can select a different compiler/CRT on the hosted runner.
          cmake --preset nw07-release -DNW_ENFORCE_PINNED_TOOLCHAIN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset nw07-release --target nw_procedural_image_player --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The authoring host is intentionally separate and diagnostic, but it
          # still uses the pinned MSVC toolchain so its PackagePlayer overlay and
          # host executable have one compatible Windows ABI/runtime model.
          $repoRoot = (Resolve-Path .).Path
          $runtimeBuild = (Resolve-Path build/nw07-release).Path
          $toolchain = (Resolve-Path cmake/toolchains/msvc-x64.cmake).Path
          cmake -S src/studio -B build/nw08-studio -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DNW_BUILD_PROFILE=dev `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DNW_STUDIO_ROOT=$repoRoot" `
            "-DNW_STUDIO_RUNTIME_BUILD_DIR=$runtimeBuild"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/nw08-studio --target nodewerk-studio-preview --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Locate native runtime inputs
        shell: pwsh
        run: |
          $preview = Get-ChildItem build/nw08-studio -Recurse -Filter nodewerk-studio-preview.exe |
            Select-Object -First 1
          $template = Get-ChildItem build/nw07-release -Recurse -Filter nw_procedural_image_player.exe |
            Select-Object -First 1
          $dxc = Get-Command dxc.exe -ErrorAction Stop
          if (-not $preview) { throw "nodewerk-studio-preview.exe was not built" }
          if (-not $template) { throw "nw_procedural_image_player.exe was not built" }
          "NW08_PREVIEW_EXE=$($preview.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NW08_PLAYER_TEMPLATE_EXE=$($template.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NW08_DXC_EXE=$($dxc.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run NW-08 regression coverage
        shell: pwsh
        run: |
          # Keep frozen nw03_compiler.py unchanged. The hosted image exposes an
          # unrelated MinGW c++.exe; remove only that directory so discovery
          # reaches the pinned LLVM clang++ already exported by NW-01.
          $pathEntries = $env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notlike '*\mingw64\bin*')
          }
          $env:PATH = $pathEntries -join ';'
          $clang = Get-Command clang++.exe -ErrorAction Stop
          Write-Host "NW-02 digest helper compiler: $($clang.Source)"
          $tests = Get-ChildItem tests/test_nw08_*.py | Select-Object -ExpandProperty FullName
          if (-not $tests) { throw "no NW-08 regression tests were discovered" }
          python -m pytest -q @tests
      - name: Create deterministic contract-test toolchain
        shell: bash
        run: |
          python tools/nw08_test_toolchain.py \
            --directory "$RUNNER_TEMP/nw08-test-toolchain" \
            --report "$RUNNER_TEMP/nw08-test-toolchain.json"
      - name: Run Windows integration validation (real export path)
        shell: bash
        run: |
          set +e
          python tools/nw08_windows_integration.py \
            --dxc "$NW08_DXC_EXE" \
            --player-template "$NW08_PLAYER_TEMPLATE_EXE" \
            --preview-executable "$NW08_PREVIEW_EXE" \
            --preview-mode package-host \
            --execution-kind software_adapter \
            --allow-software-adapter \
            --report "$RUNNER_TEMP/nw08-windows-integration.json"
          status=$?
          set -e
          python - "$RUNNER_TEMP/nw08-windows-integration.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          checks = {entry["name"]: entry["status"] for entry in report["checks"]}
          required = {
              "gui_cli_export_equivalence",
              "shader_error_recovery",
              "device_recreation",
              "fence_safe_cache",
              "gui_window_interaction",
              "runtime_shader_error_recovery",
              "runtime_device_recreation",
              "runtime_fence_safe_cache",
              "real_preview",
          }
          failed = sorted(name for name in required if checks.get(name) != "passed")
          if failed:
              raise SystemExit("NW-08 integration checks failed: " + ", ".join(failed))
          if report["hardware_evidence"]:
              raise SystemExit(
                  "contract-test integration must not claim hardware evidence"
              )
          if checks.get("real_preview") != "passed":
              raise SystemExit("native software-adapter preview did not pass")
          print(
              "NW-08 native GUI/runtime recovery, device recreation, "
              "incremental GPU reuse and preview checks passed on WARP; "
              "no physical hardware evidence claimed."
          )
          PY
          if [ "$status" -eq 2 ]; then
            echo "::notice::NW-08 native runtime/GUI coverage passed on the software D3D12 adapter; physical hardware evidence remains pending."
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::NW-08 Windows integration exited with status $status"
            exit "$status"
          fi
      - name: Upload NW-08 test toolchain
        uses: actions/upload-artifact@v4
        with:
          name: nw08-test-toolchain
          path: ${{ runner.temp }}/nw08-test-toolchain.json
      - name: Upload NW-08 integration report
        uses: actions/upload-artifact@v4
        with:
          name: nw08-windows-integration
          path: ${{ runner.temp }}/nw08-windows-integration.json

  windows-real-preview:
    needs: ci-impact
    name: Windows 11 x64 real preview (opt-in hardware host)
    if: vars.NW08_REAL_PREVIEW == '1' && needs.ci-impact.outputs.nw08 == 'true'
    runs-on: windows-2025
    env:
      NW08_PREVIEW_EXECUTABLE: ${{ vars.NW08_PREVIEW_EXECUTABLE }}
      NW08_PLAYER_TEMPLATE: ${{ vars.NW08_PLAYER_TEMPLATE }}
      NW08_DXC: ${{ vars.NW08_DXC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run real preview integration
        shell: bash
        run: |
          python tools/nw08_windows_integration.py \
            --player-template "$NW08_PLAYER_TEMPLATE" \
            --dxc "$NW08_DXC" \
            --preview-executable "$NW08_PREVIEW_EXECUTABLE" \
            --preview-mode package-host \
            --execution-kind physical \
            --report "$RUNNER_TEMP/nw08-windows-real-preview.json"
      - name: Upload NW-08 real preview report
        uses: actions/upload-artifact@v4
        with:
          name: nw08-windows-real-preview
          path: ${{ runner.temp }}/nw08-windows-real-preview.json
